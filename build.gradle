plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    splitEnvironmentSourceSets()
    mods {
        'blocky-outline' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.fork = true
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.matching { it.name.startsWith('run') }.configureEach {
    def mcJava = file('D:/Minecraft/jre/x64/bin/java.exe')
    if (mcJava.exists()) {
        executable = mcJava.absolutePath
    }
}

tasks.register('distModJar', Copy) {
    def jarTask = tasks.findByName('remapJar') ?: tasks.named('jar').get()
    dependsOn jarTask
    from jarTask.archiveFile
    into layout.projectDirectory.dir('dist')
}

tasks.named('build') { finalizedBy tasks.named('distModJar') }

